appId: org.openbridge.app
productName: OpenBridge
copyright: Copyright © 2026 OpenBridge Contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName} Setup ${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: rpm
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  category: Graphics
  maintainer: OpenBridge Contributors
  syncDesktopName: true
  synopsis: Open-source Megascans library and export manager
  description: >-
    OpenBridge is an open-source, cross-platform manager for a local Megascans
    library. It speaks the legacy Bridge local API and DCC export protocols.
  artifactName: ${name}-${version}.${arch}.${ext}

appImage:
  license: LICENSE

npmRebuild: false
