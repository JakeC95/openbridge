name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Configure Electron sandbox on the Ubuntu runner
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run typecheck
      - run: npm run check:public
      - run: npm run test:browsing
      - run: npm run test:local-state
      - run: npm run test:shared-facts
      - if: runner.os == 'Windows'
        run: npm run test:network
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:network
      - run: npm run test:providers
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm run test:browsing:ui
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:browsing:ui
        env:
          OPENBRIDGE_UI_SOFTWARE_GL: '1'
      - if: runner.os == 'Windows'
        run: npm run test:shared-library:ui
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:shared-library:ui
        env:
          OPENBRIDGE_UI_SOFTWARE_GL: '1'
