name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      OPENBRIDGE_EPIC_CLIENT_ID: ${{ secrets.OPENBRIDGE_EPIC_CLIENT_ID }}
      OPENBRIDGE_ALGOLIA_APP_ID: ${{ secrets.OPENBRIDGE_ALGOLIA_APP_ID }}
      OPENBRIDGE_ALGOLIA_API_KEY: ${{ secrets.OPENBRIDGE_ALGOLIA_API_KEY }}
      OPENBRIDGE_ALGOLIA_INDEX: ${{ secrets.OPENBRIDGE_ALGOLIA_INDEX }}
      OPENBRIDGE_API_BASE: ${{ secrets.OPENBRIDGE_API_BASE }}
      OPENBRIDGE_SSO_BASE: ${{ secrets.OPENBRIDGE_SSO_BASE }}
      OPENBRIDGE_SIGNED_URL_BASE: ${{ secrets.OPENBRIDGE_SIGNED_URL_BASE }}
      OPENBRIDGE_REALM: ${{ secrets.OPENBRIDGE_REALM }}
      OPENBRIDGE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify service configuration
        shell: bash
        run: |
          : "${OPENBRIDGE_EPIC_CLIENT_ID:?Missing Epic client ID}"
          : "${OPENBRIDGE_ALGOLIA_APP_ID:?Missing Algolia app ID}"
          : "${OPENBRIDGE_ALGOLIA_API_KEY:?Missing Algolia API key}"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:public
      - run: npm run dist:portable

      - name: Generate update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="dist/OpenBridge-$version-win-x64-portable.zip"
          else
            archive="dist/OpenBridge-$version-linux-x64-portable.tar.gz"
          fi
          node scripts/make-update-manifest.mjs "$version" "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: |
            dist/OpenBridge-*-portable.zip
            dist/OpenBridge-*-portable.tar.gz
            latest*.json
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dist/OpenBridge-*-win-x64-portable.zip
            release/dist/OpenBridge-*-linux-x64-portable.tar.gz
            release/latest.json
            release/latest-linux-x64.json
          fail_on_unmatched_files: true
          generate_release_notes: true
