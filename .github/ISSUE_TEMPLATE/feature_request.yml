name: Feature request
description: Suggest an improvement for OpenBridge
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include account details, tokens, personal paths or proprietary assets.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I removed personal information and credentials.
          required: true
        - label: I searched for an existing request.
          required: true
